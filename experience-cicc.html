<main id="main"><article class="detail-simple" aria-label="中金公司实习经历"><figure><img src="assets/internship-illustrations/01-cicc-portrait-v2.png?v=outfit" alt="毛绒艺潞研究汽车行业，维护数据、拆解公司并做 DCF 估值" width="1024" height="1536" decoding="async"></figure><section class="detail-resume"><h1>中金公司</h1><p class="detail-role">研究部汽车组行研实习生</p><ul>
              <li><strong>汽车经销商行业深度研究：</strong>基于汽车经销商行业新车销售量价齐跌，行业进入洗牌阶段的现状，从新能源开放经销模式、竞争格局走向集中、利润结构转向售后三大角度分析其发展前景与应对方式，深度分析中升、永达 2 家龙头，独立搭建 DCF 财务估值模型，输出 40 余页行业深度报告</li>
              <li><strong>数据库搭建与监控：</strong>搭建涵盖 30+车企、50+核心指标的数据库并持续维护；运用数据透视表、VLOOKUP 函数制作包括价格走势、产销量、交强险上牌量等的月度趋势看板，输出 12 份数据周报与月报</li>
            </ul></section></article></main></body></html>
